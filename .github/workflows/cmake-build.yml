name: CMake Build

on:
  workflow_call:
    inputs:
      cmake_preset:
        required: true
        type: string
      compiler:
        required: false
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      use_emcmake:
        required: false
        type: boolean
        default: false
      build_container:
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    container: ${{ inputs.build_container != '' && inputs.build_container || null }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup C++ environment
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ inputs.compiler != '' && inputs.compiler || null }}
          cmake: 4.4.0
          ninja: 1.13.2
          vcvarsall: ${{ contains(inputs.os, 'windows') }}

      - name: Install dependencies (Ubuntu)
        if: inputs.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxi-dev libxcursor-dev

      - name: Configure CMake (Emscripten)
        if: inputs.use_emcmake == true
        env:
          BUILD_COMMIT_HASH: ${{ github.sha }}
        run: >
          emcmake cmake --preset ${{ inputs.cmake_preset }}
          -DCMAKE_TOOLCHAIN_FILE="/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          -B build_dir
          -S .

      - name: Configure CMake
        if: inputs.use_emcmake == false
        run: >
          cmake --preset ${{ inputs.cmake_preset }}
          -B build_dir
          -S ${{ github.workspace }}
          ${{ case(contains(inputs.cmake_preset, 'clang'), format('-DCMAKE_CXX_STDLIB_MODULES_JSON={0}/libc++.modules.json', env.LLVM_LIBRARY_PATH), '')}}


      - name: Build
        run: cmake --build build_dir

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.cmake_preset }}
          path: |
            build_dir/src
            !build_dir/src/cmake*
            !build_dir/src/CMakeFiles
