<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gromada viewer (Web edition)</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: #000;
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Стили для стартового окна выбора файлов */
        #startup-ui {
            position: absolute;
            background: rgba(40, 40, 40, 0.95);
            padding: 30px;
            border-radius: 8px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; /* Скрыто до полной инициализации Wasm */
            flex-direction: column;
            gap: 15px;
            width: 420px;
            max-width: 90vw;
        }

        #dropzone {
            border: 2px dashed #777;
            border-radius: 6px;
            padding: 30px 15px;
            color: #ccc;
            transition: border-color 0.15s, background-color 0.15s;
        }

        #dropzone.dragover {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        #file-list {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            color: #ddd;
        }
        #file-list li {
            padding: 2px 6px;
            font-family: monospace;
            word-break: break-all;
        }

        #status {
            text-align: left;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ddd;
        }
        .status-item::before {
            content: '';
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #777;
            flex: 0 0 auto;
        }
        .status-item.ok::before { background: #4CAF50; box-shadow: 0 0 6px rgba(76, 175, 80, 0.8); }
        .status-item.error::before { background: #e05252; box-shadow: 0 0 6px rgba(224, 82, 82, 0.8); }
        .status-item.warn::before { background: #e0a252; box-shadow: 0 0 6px rgba(224, 162, 82, 0.8); }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        button:disabled { background: #555; cursor: not-allowed; }

        /* Панель "есть несохранённые файлы", появляется после записи в VFS */
        #save-panel {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(40, 40, 40, 0.95);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            z-index: 1000;
        }
        #save-panel.visible { display: flex; }
        #save-panel button {
            padding: 6px 12px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<!-- Оверлей для загрузки файлов -->
<div id="startup-ui">
    <h2>Preparing for launch</h2>
    <p>Provide game resources (fw.res and, optionally, a "maps" folder)</p>
    <div id="dropzone">Drop files or folders here</div>
    <div id="status">
        <div id="status-res" class="status-item">fw.res: —</div>
        <div id="status-maps" class="status-item">maps: —</div>
        <div id="status-font" class="status-item">font: —</div>
    </div>
    <ul id="file-list"></ul>
    <button id="start-btn" disabled>Launch viewer</button>
</div>

<!-- Панель уведомления о несохранённых файлах, появившихся в VFS во время работы -->
<div id="save-panel">
    <span id="save-panel-text">0 files changed</span>
    <button id="save-panel-btn">Download</button>
</div>

<script type="text/javascript">
    var Module = {
        // 1. ЗАПРЕЩАЕМ автозапуск main()
        noInitialRun: true,

        canvas: (function() {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener("webglcontextlost", function(e) {
                alert('WebGL context lost.'); e.preventDefault();
            }, false);
            return canvas;
        })(),

        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },

        // 2. Эта функция вызовется, когда WebAssembly будет готов к работе,
        // а виртуальная файловая система (FS) инициализирована.
        onRuntimeInitialized: function() {
            var ui = document.getElementById('startup-ui');
            var dropzone = document.getElementById('dropzone');
            var fileListEl = document.getElementById('file-list');
            var statusResEl = document.getElementById('status-res');
            var statusMapsEl = document.getElementById('status-maps');
            var statusFontEl = document.getElementById('status-font');
            var btn = document.getElementById('start-btn');

            // Приложению нужен хотя бы один .ttf в корне VFS (см. Application::setupFont,
            // который сканирует current_path() без рекурсии). Если пользователь не
            // перетащил свой шрифт — при запуске скачиваем свободный шрифт с кириллицей
            // (PT Sans, OFL) из репозитория Google Fonts и монтируем его в корень.
            var FALLBACK_FONT_URL = 'https://raw.githubusercontent.com/google/fonts/main/ofl/ptsans/PT_Sans-Web-Regular.ttf';
            var FALLBACK_FONT_VFS_NAME = 'PTSans-Regular.ttf';

            // Показываем UI
            ui.style.display = 'flex';

            // Файлы, ожидающие монтирования: { path: 'relative/path.ext' (без ведущего '/'), file: File }
            var pendingFiles = [];
            // Относительные пути верхнеуровневых перетащенных элементов (файлов или папок) —
            // используются только для отображения списка в UI.
            var topLevelPaths = [];

            // Требования к набору файлов:
            // - "fw.res" должен лежать прямо в корне VFS;
            // - папка "maps" опциональна, но если она есть — в ней (или подпапках)
            //   должен быть хотя бы один файл с расширением .map.
            function validate() {
                var hasFwRes = pendingFiles.some(function(f) { return f.path === 'fw.res'; });
                var mapsFiles = pendingFiles.filter(function(f) { return f.path.indexOf('maps/') === 0; });
                var mapsPresent = mapsFiles.length > 0;
                var mapsHasMapFile = mapsFiles.some(function(f) { return /\.map$/i.test(f.path); });
                var mapsValid = !mapsPresent || mapsHasMapFile;

                return {
                    hasFwRes: hasFwRes,
                    mapsPresent: mapsPresent,
                    mapsValid: mapsValid,
                    ok: hasFwRes && mapsValid
                };
            }

            function renderList() {
                fileListEl.innerHTML = '';
                topLevelPaths.forEach(function(p) {
                    var li = document.createElement('li');
                    li.textContent = p;
                    fileListEl.appendChild(li);
                });

                var v = validate();

                statusResEl.textContent = v.hasFwRes ? 'fw.res: found' : 'fw.res: not found (required)';
                statusResEl.className = 'status-item ' + (v.hasFwRes ? 'ok' : 'error');

                if (!v.mapsPresent) {
                    statusMapsEl.textContent = 'maps: not provided (optional)';
                    statusMapsEl.className = 'status-item warn';
                } else if (v.mapsValid) {
                    statusMapsEl.textContent = 'maps: found, contains .map file(s)';
                    statusMapsEl.className = 'status-item ok';
                } else {
                    statusMapsEl.textContent = 'maps: found, but contains no .map file';
                    statusMapsEl.className = 'status-item error';
                }

                var hasCustomFont = pendingFiles.some(function(f) {
                    return f.path.indexOf('/') === -1 && /\.ttf$/i.test(f.path);
                });
                if (hasCustomFont) {
                    statusFontEl.textContent = 'font: custom .ttf provided';
                    statusFontEl.className = 'status-item ok';
                } else {
                    statusFontEl.textContent = 'font: none provided — a free Cyrillic font will be downloaded automatically';
                    statusFontEl.className = 'status-item warn';
                }

                btn.disabled = !v.ok;
            }

            function stripLeadingSlash(path) {
                return path.replace(/^\/+/, '');
            }

            // Расширение файла — техническая деталь, а не часть "имени, за которое отвечает
            // пользователь", поэтому регистр расширения нормализуем к нижнему (fw.RES, .TTF,
            // .Map и т.п. из разных ОС/файловых систем не должны ломать сопоставление ниже).
            // Остальная часть пути (каталоги, имя файла до расширения) остаётся как есть.
            function normalizeExtensionCase(path) {
                var slashIdx = path.lastIndexOf('/');
                var basename = slashIdx === -1 ? path : path.substring(slashIdx + 1);
                var dotIdx = basename.lastIndexOf('.');
                if (dotIdx <= 0) return path;
                var dir = slashIdx === -1 ? '' : path.substring(0, slashIdx + 1);
                return dir + basename.substring(0, dotIdx) + basename.substring(dotIdx).toLowerCase();
            }

            function readEntryAsFile(entry) {
                return new Promise(function(resolve, reject) {
                    entry.file(resolve, reject);
                });
            }

            // FileSystemDirectoryReader.readEntries нужно вызывать в цикле,
            // пока не вернётся пустой массив — за один вызов отдаются не все файлы.
            function readAllDirectoryEntries(reader) {
                return new Promise(function(resolve, reject) {
                    var allEntries = [];
                    function readBatch() {
                        reader.readEntries(function(entries) {
                            if (entries.length === 0) {
                                resolve(allEntries);
                            } else {
                                allEntries = allEntries.concat(entries);
                                readBatch();
                            }
                        }, reject);
                    }
                    readBatch();
                });
            }

            // Рекурсивно обходит FileSystemEntry (файл или папку) и складывает
            // найденные файлы в pendingFiles с относительным путём (entry.fullPath).
            function collectEntry(entry) {
                if (entry.isFile) {
                    return readEntryAsFile(entry).then(function(file) {
                        pendingFiles.push({ path: normalizeExtensionCase(stripLeadingSlash(entry.fullPath)), file: file });
                    });
                } else if (entry.isDirectory) {
                    var reader = entry.createReader();
                    return readAllDirectoryEntries(reader).then(function(entries) {
                        return Promise.all(entries.map(collectEntry));
                    });
                }
                return Promise.resolve();
            }

            function handleDrop(e) {
                e.preventDefault();
                dropzone.classList.remove('dragover');

                var items = e.dataTransfer.items;
                if (!items) return;

                var topEntries = [];
                for (var i = 0; i < items.length; i++) {
                    var getEntry = items[i].webkitGetAsEntry || items[i].getAsEntry;
                    var entry = getEntry && getEntry.call(items[i]);
                    if (entry) topEntries.push(entry);
                }

                Promise.all(topEntries.map(function(entry) {
                    topLevelPaths.push(stripLeadingSlash(entry.fullPath));
                    return collectEntry(entry);
                })).then(renderList).catch(function(err) {
                    console.error('Error reading dropped files:', err);
                });
            }

            dropzone.addEventListener('dragover', function(e) {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });
            dropzone.addEventListener('dragleave', function() {
                dropzone.classList.remove('dragover');
            });
            dropzone.addEventListener('drop', handleDrop);

            function mkdirTreeForFile(path) {
                var idx = path.lastIndexOf('/');
                if (idx > 0) {
                    Module.FS.mkdirTree('/' + path.substring(0, idx));
                }
            }

            // Читает File и монтирует его в виртуальную ФС Emscripten по относительному пути,
            // создавая при необходимости промежуточные директории.
            function writeFileToVFS(entryInfo) {
                return new Promise(function(resolve, reject) {
                    var reader = new FileReader();
                    reader.onload = function(event) {
                        var data = new Uint8Array(event.target.result);
                        mkdirTreeForFile(entryInfo.path);
                        Module.FS.writeFile('/' + entryInfo.path, data);
                        console.log('File successfully loaded into VFS at path: /' + entryInfo.path);
                        resolve();
                    };
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(entryInfo.file);
                });
            }

            // Если пользователь не подложил свой .ttf — скачивает шрифт с кириллицей
            // с CDN и монтирует его в корень VFS. Ошибка скачивания не блокирует запуск —
            // приложение в этом случае просто останется без кастомного шрифта.
            function ensureFallbackFont() {
                var hasCustomFont = pendingFiles.some(function(f) {
                    return f.path.indexOf('/') === -1 && /\.ttf$/i.test(f.path);
                });
                if (hasCustomFont) {
                    return Promise.resolve();
                }

                return fetch(FALLBACK_FONT_URL).then(function(resp) {
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    return resp.arrayBuffer();
                }).then(function(buf) {
                    Module.FS.writeFile('/' + FALLBACK_FONT_VFS_NAME, new Uint8Array(buf));
                    console.log('Fallback Cyrillic font loaded into VFS at /' + FALLBACK_FONT_VFS_NAME);
                }).catch(function(err) {
                    console.warn('Could not download fallback font, continuing without it:', err);
                });
            }

            // Обрабатываем нажатие на старт
            btn.addEventListener('click', function() {
                if (!validate().ok) return;
                btn.disabled = true;

                // 3. Монтируем все перетащенные файлы в VFS и, при необходимости,
                // докачиваем фолбэк-шрифт — всё это должно завершиться до запуска wasm.
                Promise.all([
                    Promise.all(pendingFiles.map(writeFileToVFS)),
                    ensureFallbackFont()
                ]).then(function() {
                    // Прячем интерфейс
                    ui.style.display = 'none';

                    installWriteTracking();

                    // 4. Вручную запускаем C++ main() без аргументов: достаточно наличия в рабочей директории fw.res
                    Module.callMain([]);
                }).catch(function(err) {
                    console.error('Failed to mount files into VFS:', err);
                    btn.disabled = false;
                });
            });

            // --- Отслеживание файлов, записанных приложением в VFS во время работы, ---
            // --- и предложение пользователю скачать их
            var savePanel = document.getElementById('save-panel');
            var savePanelText = document.getElementById('save-panel-text');
            var savePanelBtn = document.getElementById('save-panel-btn');
            var dirtyFiles = new Set();

            function updateSavePanel() {
                if (dirtyFiles.size === 0) {
                    savePanel.classList.remove('visible');
                    return;
                }
                savePanelText.textContent = dirtyFiles.size + (dirtyFiles.size === 1 ? ' file changed' : ' files changed');
                savePanel.classList.add('visible');
            }

            // Вызывается один раз, после монтирования входных файлов и перед callMain —
            // см. вызов installWriteTracking() в обработчике клика на "Launch viewer" выше.
            function installWriteTracking() {
                var origFsWrite = Module.FS.write;
                Module.FS.write = function(stream, buffer, offset, length, position, canOwn) {
                    var bytesWritten = origFsWrite.call(Module.FS, stream, buffer, offset, length, position, canOwn);
                    if (bytesWritten > 0 && stream && stream.path) {
                        dirtyFiles.add(stream.path);
                        updateSavePanel();
                    }
                    return bytesWritten;
                };
            }

            // --- Упаковка изменённых файлов в один .zip и скачивание одним файлом.   ---
            // --- Сжатие (DEFLATE) делает нативный CompressionStream браузера — не    ---
            // --- переизобретаем алгоритм сжатия. Сам контейнер zip собираем вручную, ---
            // --- т.к. готового браузерного API для него нет, но это лишь реализация  ---
            // --- фиксированного формата (заголовок на файл, центральный каталог,     ---
            // --- завершающая запись, CRC32) — так же поступают и сторонние минимальные ---
            // --- zip-библиотеки (напр. client-zip). Если CompressionStream недоступен ---
            // --- (старый браузер) — файл кладётся в архив как есть (store).          ---

            var crc32Table = (function() {
                var table = new Uint32Array(256);
                for (var n = 0; n < 256; n++) {
                    var c = n;
                    for (var k = 0; k < 8; k++) {
                        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                    }
                    table[n] = c >>> 0;
                }
                return table;
            })();

            function crc32(data) {
                var crc = 0xFFFFFFFF;
                for (var i = 0; i < data.length; i++) {
                    crc = crc32Table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
                }
                return (crc ^ 0xFFFFFFFF) >>> 0;
            }

            // Zip хранит время/дату в DOS-формате (в файле часто расходится с реальным
            // временем модификации в VFS на пару секунд из-за 2-секундной точности DOS-формата
            // — это нормально и не мешает распаковке).
            function dosDateTime(date) {
                return {
                    time: ((date.getHours() & 0x1F) << 11) | ((date.getMinutes() & 0x3F) << 5) | ((date.getSeconds() >> 1) & 0x1F),
                    date: (((date.getFullYear() - 1980) & 0x7F) << 9) | (((date.getMonth() + 1) & 0xF) << 5) | (date.getDate() & 0x1F)
                };
            }

            function deflateRaw(data) {
                var stream = new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
                return new Response(stream).arrayBuffer().then(function(buf) { return new Uint8Array(buf); });
            }

            // entry: { name, data: Uint8Array } -> { name, rawData, storedData, method }
            // method: 8 = deflate, 0 = store (нет CompressionStream или сжатие не дало выигрыша).
            function compressEntry(entry) {
                if (!window.CompressionStream) {
                    return Promise.resolve({ name: entry.name, rawData: entry.data, storedData: entry.data, method: 0 });
                }
                return deflateRaw(entry.data).then(function(compressed) {
                    var useCompressed = compressed.length < entry.data.length;
                    return {
                        name: entry.name,
                        rawData: entry.data,
                        storedData: useCompressed ? compressed : entry.data,
                        method: useCompressed ? 8 : 0
                    };
                });
            }

            // entries: [{ name: 'relative/path.ext', data: Uint8Array }]
            function buildZipBlob(entries) {
                return Promise.all(entries.map(compressEntry)).then(function(compressed) {
                    var now = dosDateTime(new Date());
                    var localParts = [];
                    var centralParts = [];
                    var offset = 0;

                    compressed.forEach(function(entry) {
                        var nameBytes = new TextEncoder().encode(entry.name);
                        var crc = crc32(entry.rawData);
                        var uncompressedSize = entry.rawData.length;
                        var compressedSize = entry.storedData.length;

                        var local = new DataView(new ArrayBuffer(30));
                        local.setUint32(0, 0x04034b50, true);
                        local.setUint16(4, 20, true);
                        local.setUint16(6, 0x0800, true); // UTF-8 имя
                        local.setUint16(8, entry.method, true);
                        local.setUint16(10, now.time, true);
                        local.setUint16(12, now.date, true);
                        local.setUint32(14, crc, true);
                        local.setUint32(18, compressedSize, true);
                        local.setUint32(22, uncompressedSize, true);
                        local.setUint16(26, nameBytes.length, true);
                        local.setUint16(28, 0, true);

                        localParts.push(new Uint8Array(local.buffer), nameBytes, entry.storedData);

                        var central = new DataView(new ArrayBuffer(46));
                        central.setUint32(0, 0x02014b50, true);
                        central.setUint16(4, 20, true);
                        central.setUint16(6, 20, true);
                        central.setUint16(8, 0x0800, true);
                        central.setUint16(10, entry.method, true);
                        central.setUint16(12, now.time, true);
                        central.setUint16(14, now.date, true);
                        central.setUint32(16, crc, true);
                        central.setUint32(20, compressedSize, true);
                        central.setUint32(24, uncompressedSize, true);
                        central.setUint16(28, nameBytes.length, true);
                        central.setUint32(42, offset, true);

                        centralParts.push(new Uint8Array(central.buffer), nameBytes);

                        offset += local.buffer.byteLength + nameBytes.length + compressedSize;
                    });

                    var centralOffset = offset;
                    var centralSize = centralParts.reduce(function(sum, p) { return sum + p.length; }, 0);

                    var end = new DataView(new ArrayBuffer(22));
                    end.setUint32(0, 0x06054b50, true);
                    end.setUint16(8, compressed.length, true);
                    end.setUint16(10, compressed.length, true);
                    end.setUint32(12, centralSize, true);
                    end.setUint32(16, centralOffset, true);

                    return new Blob(localParts.concat(centralParts, [new Uint8Array(end.buffer)]), { type: 'application/zip' });
                });
            }

            function downloadAllAsZip(paths) {
                var entries = paths.map(function(path) {
                    return { name: path.replace(/^\/+/, ''), data: Module.FS.readFile(path) };
                });
                return buildZipBlob(entries).then(function(blob) {
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'gromada-viewer-output.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
                });
            }

            savePanelBtn.addEventListener('click', function() {
                var paths = Array.from(dirtyFiles);
                if (paths.length === 0) return;

                downloadAllAsZip(paths).then(function() {
                    paths.forEach(function(path) { dirtyFiles.delete(path); });
                    updateSavePanel();
                }).catch(function(err) {
                    console.error('Failed to build zip archive:', err);
                });
            });

            // Нативное предупреждение "изменения могут быть потеряны"
            window.addEventListener('beforeunload', function(e) {
                if (dirtyFiles.size > 0) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });
        }
    };
</script>

</body>
</html>
