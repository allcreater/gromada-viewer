<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя WebGL игра с загрузкой файла</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: #000;
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Стили для стартового окна выбора файла */
        #startup-ui {
            position: absolute;
            background: rgba(40, 40, 40, 0.95);
            padding: 30px;
            border-radius: 8px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; /* Скрыто до полной инициализации Wasm */
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        button:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<!-- Оверлей для выбора файла -->
<div id="startup-ui">
    <h2>Подготовка к запуску</h2>
    <p>Выберите файл конфигурации или ресурса для загрузки:</p>
    <input type="file" id="file-picker">
    <button id="start-btn" disabled>Запустить игру</button>
</div>

<script type="text/javascript">
    var Module = {
        // 1. ЗАПРЕЩАЕМ автозапуск main()
        noInitialRun: true,

        canvas: (function() {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener("webglcontextlost", function(e) {
                alert('Контекст WebGL потерян.'); e.preventDefault();
            }, false);
            return canvas;
        })(),

        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },

        // 2. Эта функция вызовется, когда WebAssembly будет готов к работе,
        // а виртуальная файловая система (FS) инициализирована.
        onRuntimeInitialized: function() {
            var ui = document.getElementById('startup-ui');
            var picker = document.getElementById('file-picker');
            var btn = document.getElementById('start-btn');

            // Показываем UI
            ui.style.display = 'flex';

            // Активируем кнопку только когда файл выбран
            picker.addEventListener('change', function(e) {
                btn.disabled = e.target.files.length === 0;
            });

            // Обрабатываем нажатие на старт
            btn.addEventListener('click', function() {
                var file = picker.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function(event) {
                    // Конвертируем прочитанные данные в массив байтов
                    var data = new Uint8Array(event.target.result);

                    // 3. Сохраняем файл в виртуальную файловую систему Emscripten
                    var vfsPath = '/' + file.name;
                    Module.FS.writeFile(vfsPath, data);

                    console.log('Файл успешно загружен в VFS по пути: ' + vfsPath);

                    // Прячем интерфейс
                    ui.style.display = 'none';

                    // 4. Вручную запускаем C++ main(), передавая путь к файлу
                    // Это эквивалентно запуску: ./my_game /filename.ext
                    Module.callMain([vfsPath]);
                };

                // Читаем файл как бинарные данные
                reader.readAsArrayBuffer(file);
            });
        }
    };
</script>

{{{ SCRIPT }}}

</body>
</html>
